name: Build Windows desktop player

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag for the installer
        required: true
        default: desktop-v0.1.1

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AnimalBank_V3_Batch8N_FinalUnified_20260830/desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AnimalBank_V3_Batch8N_FinalUnified_20260830/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: AnimalBank_V3_Batch8N_FinalUnified_20260830/desktop/src-tauri
          cache-on-failure: true

      - name: Install desktop dependencies
        run: npm ci

      - name: Generate desktop icons
        run: npm run icons

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: AnimalBank_V3_Batch8N_FinalUnified_20260830/desktop/src-tauri

      - name: Test desktop importer
        run: cargo test --locked
        working-directory: AnimalBank_V3_Batch8N_FinalUnified_20260830/desktop/src-tauri

      - name: Build locked Rust release
        run: cargo build --release --locked
        working-directory: AnimalBank_V3_Batch8N_FinalUnified_20260830/desktop/src-tauri

      - name: Build Windows application
        run: npm run build -- --bundles nsis

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: animal-band-classroom-windows
          if-no-files-found: error
          path: |
            AnimalBank_V3_Batch8N_FinalUnified_20260830/desktop/src-tauri/target/release/bundle/nsis/*.exe
            AnimalBank_V3_Batch8N_FinalUnified_20260830/desktop/src-tauri/target/release/bundle/msi/*.msi

  publish-release:
    name: Publish installers
    needs: build-windows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: animal-band-classroom-windows
          path: release-assets

      - name: Create or update GitHub Release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "动物乐队课堂 Windows 安装包 v0.1.1" \
              --notes "面向老师的 Windows 离线课堂播放器。下载安装后可直接导入网页端下载的 .animalclass 课程包。"
          fi
          gh release upload "$RELEASE_TAG" release-assets/nsis/*.exe --clobber
